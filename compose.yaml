services:
  course:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: intro-robotics-course:jazzy
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"

