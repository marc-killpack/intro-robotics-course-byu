services:
  course:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: intro-robotics-course:jazzy
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:6080:6080"
    # PlotJuggler sends a usage report to this address at every launch and has
    # no setting to turn it off; pointing it at the container itself blocks it.
    extra_hosts:
      - "app.plotjuggler.io:127.0.0.1"
    environment:
      DISPLAY: ":1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      # Browser-desktop size; override with COURSE_SCREEN=WIDTHxHEIGHT in a .env file.
      COURSE_SCREEN: "${COURSE_SCREEN:-1280x800}"

